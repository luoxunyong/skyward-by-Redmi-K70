[package]
name = "skyward-install"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
abootimg-oxide = "0.5.2"
anyhow = { workspace = true }
cms = "0.2.3"
cpio = "0.4.1"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
libc = { workspace = true }
lz4_flex = "0.14.0"
p256 = { version = "0.13.2", features = ["pkcs8"] }
polyfuse-kernel = "0.2.0"
rsa = "0.9.10"
sha1 = { version = "0.10.7", features = ["oid"] }
sha2 = { version = "0.10.9", features = ["oid"] }
skyward-block = { path = "../skyward-block" }
skyward-config = { path = "../skyward-config" }
skyward-info = { path = "../skyward-info" }
skyward-vab = { path = "../skyward-vab" }
unpayload = { version = "0.1.1", default-features = false }
bzip2 = "0.6"
liblzma = { version = "0.4", default-features = false, features = ["static"] }
x509-cert = "0.2.5"
zerocopy = { version = "0.8.63", features = ["derive"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = { version = "0.14.3", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
skyward-sys = { path = "../skyward-sys" }

[dev-dependencies]
tempfile = "3.27.0"
